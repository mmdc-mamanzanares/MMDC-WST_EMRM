<!DOCTYPE html>
<html>
<head>
	<title>EMRMS Login</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="login-container">
    	<h2>
        	Employee Records Management System
    	</h2>
    	<label>
        	Username
    	</label>
    	<input
        	type="text"
        	id="username">
    	<span
        	id="usernameError"
        	class="error">
    	</span>
    	<label>
        	Password
    	</label>
    	<input
        	type="password"
        	id="password">
    	<span
        	id="passwordError"
        	class="error">
    	</span>
    	<div
        	id="loginError"
        	class="error">
    	</div>
    	<button
        	onclick="login()">
        	Login
    	</button>
	</div>
	<script src="login.js"></script>
</body>
</html>
